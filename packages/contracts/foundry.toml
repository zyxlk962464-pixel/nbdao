[profile.default]
src = "src"
test = "test"
out = "out"
solc_version = "0.8.30"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/=../../node_modules/@openzeppelin/"]
allow_paths = ["../../node_modules"]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 32
